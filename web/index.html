<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoa cho em🌸</title>
<style>
  html, body { margin: 0; height: 100%; background: #03030a; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---------- tiện ích ----------
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const rad = d => d * Math.PI / 180;
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  // ---------- trạng thái ----------
  let W, H, S, cx, groundY, DPR;
  let flowers = [], baseLeaves = [], grass = [], sparkles = [];
  const hearts = [];
  const t0 = performance.now();
  let nextHeart = 1.5;

  function build() {
    const r = mulberry32(20261012);
    const R = (a, b) => a + r() * (b - a);
    S = Math.max(0.5, Math.min(W / 420, H / 720));
    cx = W / 2;
    groundY = H * 0.86;

    // 4 bông hoa: dx = lệch ngang, h = chiều cao, bend = độ cong, delay = lúc bắt đầu mọc (giây)
   const defs = [
      { dx: -6,  h: 320, bend: 10,  delay: 1.0, grow: 3.0, size: 1.5 },
      { dx: -30, h: 220, bend: -70, delay: 2.4, grow: 2.6, size: 1.4 },
      { dx: 8,   h: 200, bend: 18,  delay: 3.6, grow: 2.4, size: 1.3 },
      { dx: 26,  h: 230, bend: 75,  delay: 4.8, grow: 2.6, size: 1.4 },
    ];
    flowers = defs.map(d => ({
      x: cx + d.dx * S, h: d.h * S, bend: d.bend * S, delay: d.delay, grow: d.grow,
      size: d.size * S, phase: R(0, TAU), tilt: R(-0.15, 0.15),
      leaves: [
        { u: 0.22, side: 1,  len: R(36, 46), wid: R(8, 11) },
        { u: 0.38, side: -1, len: R(40, 52), wid: R(9, 12) },
        { u: 0.55, side: 1,  len: R(34, 44), wid: R(8, 10) },
      ],
    }));

    // lá lớn ở gốc
    baseLeaves = [];
    for (let i = 0; i < 18; i++) {
      const ang = -Math.PI * R(0.06, 0.94);
      baseLeaves.push({
        x: cx + R(-40, 40) * S, y: groundY + R(0, 14) * S, ang,
        len: R(55, 120) * S * (1 - Math.abs(Math.cos(ang)) * 0.2), wid: R(14, 26) * S,
        delay: R(0, 1.6), dur: R(1.2, 2.0), sp: R(0.6, 1.2), ph: R(0, TAU),
        c1: '#061d0c', c2: ['#175a2c', '#124a24', '#1b6a35'][Math.floor(R(0, 3))],
      });
    }

    // cỏ
    grass = [];
    const n = Math.round(clamp(W / 6, 60, 220));
    const palette = ['#0b3a1e', '#125a2b', '#1a7a3b', '#08301a', '#0f4a25'];
    for (let i = 0; i < n; i++) {
      const g = (r() + r() + r() - 1.5) / 1.5;
      const x = r() < 0.7 ? cx + g * W * 0.55 : R(-10, W + 10);
      const y = groundY + R(-4, (H - groundY) * 0.95);
      const centerF = 1 - Math.min(1, Math.abs(x - cx) / (W * 0.6)) * 0.55;
      grass.push({
        x, y, h: R(28, 150) * S * centerF, w: R(1.2, 3.2) * S, lean: R(-26, 26),
        delay: R(0, 2.4), dur: R(1.2, 2.2), sp: R(0.7, 1.6), ph: R(0, TAU), sw: R(3, 9),
        col: palette[Math.floor(r() * palette.length)], layer: y > groundY + (H - groundY) * 0.5 ? 1 : 0,
      });
    }
    grass.sort((a, b) => a.y - b.y);

    // đốm sáng lấp lánh
    sparkles = [];
    for (let i = 0; i < 60; i++) {
      sparkles.push({
        x: cx + R(-150, 150) * S, y: groundY - R(50, 310) * S, r: R(0.6, 1.7),
        sp: R(4, 14) * S, ph: R(0, TAU), tw: R(1, 3),
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }
  window.addEventListener('resize', resize);

  // ---------- vẽ từng phần ----------
  function stemPt(f, u, time) {
    const p0x = f.x,               p0y = groundY;
    const p1x = f.x - f.bend * 0.2, p1y = groundY - f.h * 0.55;
    const p2x = f.x + f.bend,       p2y = groundY - f.h;
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return [
      a * p0x + b * p1x + c * p2x + Math.sin(time * 0.9 + f.phase) * 5 * S * u * u,
      a * p0y + b * p1y + c * p2y,
    ];
  }

  function leaf(x, y, ang, len, wid, k, c1, c2) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang); ctx.scale(k, k);
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * 0.3, -wid, len * 0.7, -wid * 0.8, len, 0);
    ctx.bezierCurveTo(len * 0.7, wid * 0.8, len * 0.3, wid, 0, 0);
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,255,200,0.16)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.9, 0); ctx.stroke();
    ctx.restore();
  }

  function drawBaseLeaf(l, time) {
    const k = easeOut(clamp((time - l.delay) / l.dur));
    if (k <= 0) return;
    leaf(l.x, l.y, l.ang + Math.sin(time * l.sp + l.ph) * 0.04, l.len, l.wid, k, l.c1, l.c2);
  }

  function drawBlade(b, time) {
    const k = easeOut(clamp((time - b.delay) / b.dur));
    if (k <= 0) return;
    const h = b.h * k;
    const off = b.lean * S * k * 0.5 + Math.sin(time * b.sp + b.ph) * b.sw * S * k;
    ctx.fillStyle = b.col;
    ctx.beginPath();
    ctx.moveTo(b.x - b.w, b.y);
    ctx.quadraticCurveTo(b.x - b.w * 0.5 + off * 0.2, b.y - h * 0.6, b.x + off, b.y - h);
    ctx.quadraticCurveTo(b.x + b.w * 0.5 + off * 0.5, b.y - h * 0.5, b.x + b.w, b.y);
    ctx.closePath();
    ctx.fill();
  }

  function drawStem(f, time) {
    const g = easeOut(clamp((time - f.delay) / f.grow));
    if (g <= 0) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1b7a39';
    ctx.lineWidth = 3.2 * S;
    ctx.beginPath();
    const steps = Math.max(2, Math.ceil(g / 0.04));
    for (let i = 0; i <= steps; i++) {
      const [x, y] = stemPt(f, (g * i) / steps, time);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(120,230,150,0.35)';
    ctx.lineWidth = 1 * S;
    ctx.stroke();

    // lá dọc thân
    for (const lf of f.leaves) {
      if (g <= lf.u) continue;
      const k = easeOut(clamp((g - lf.u) / 0.25));
      const [x, y] = stemPt(f, lf.u, time);
      const [x2, y2] = stemPt(f, lf.u + 0.02, time);
      const tang = Math.atan2(y2 - y, x2 - x);
      leaf(x, y, tang + lf.side * 0.95, lf.len * S, lf.wid * S, k, '#0d3a1c', '#2a8f4b');
    }
  }

  const PETAL_FINAL = [-125, -55, -190, 10, 90].map(rad);
  const PETAL_LEN   = [0.85, 0.85, 1.05, 1.05, 0.95];

  function petal(L) {
    const w = L * 0.62;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(L * 0.1, -w * 0.9, L * 0.55, -w * 1.1, L * 0.85, -w * 0.55);
    ctx.bezierCurveTo(L * 1.0, -w * 0.25, L * 1.0, w * 0.25, L * 0.85, w * 0.55);
    ctx.bezierCurveTo(L * 0.55, w * 1.1, L * 0.1, w * 0.9, 0, 0);
    ctx.closePath();
  }

  function drawHead(f, time) {
    const g = easeOut(clamp((time - f.delay) / f.grow));
    if (g <= 0) return;
    const born = clamp((time - f.delay - f.grow * 0.85) / 1.8);
    const k = 0.22 + 0.78 * easeOutBack(born);
    const open = easeOut(born);
    const sz = f.size * k;
    const [tx, ty] = stemPt(f, g, time);

    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(f.tilt + Math.sin(time * 0.9 + f.phase) * 0.05);

    // vầng sáng hồng
    const gr = sz * 62;
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
    glow.addColorStop(0, `rgba(255,60,120,${0.24 * born})`);
    glow.addColorStop(1, 'rgba(255,60,120,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, gr, 0, TAU); ctx.fill();

    ctx.scale(1, 0.62); // nhìn nghiêng cho có chiều sâu
    for (let i = 0; i < 5; i++) {
      const L = 30 * sz * PETAL_LEN[i];
      const start = -Math.PI / 2 + (PETAL_FINAL[i] + Math.PI / 2) * 0.35;
      ctx.save();
      ctx.rotate(lerp(start, PETAL_FINAL[i], open));
      const pg = ctx.createLinearGradient(0, 0, L, 0);
      pg.addColorStop(0, '#ff8fb4');
      pg.addColorStop(0.5, '#e91e63');
      pg.addColorStop(1, '#a8124f');
      petal(L);
      ctx.fillStyle = pg; ctx.fill();
      ctx.strokeStyle = 'rgba(255,170,205,0.45)'; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.restore();
    }
    // nhụy sáng
    const cr = 11 * sz;
    const cg = ctx.createRadialGradient(0, cr * 0.25, 0, 0, cr * 0.25, cr);
    cg.addColorStop(0, '#fffbe6');
    cg.addColorStop(0.45, '#ffd27a');
    cg.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, cr * 0.25, cr, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe9a8';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.arc(i * 2.2 * sz, -cr * 0.35 - Math.abs(i) * 0.6 * sz, 0.9 * sz, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawSparkles(time, dt) {
    const appear = clamp((time - 4) / 3);
    if (appear <= 0) return;
    const top = groundY - 330 * S;
    for (const s of sparkles) {
      s.y -= s.sp * dt;
      s.x += Math.sin(time * 0.5 + s.ph) * 4 * S * dt;
      if (s.y < top) { s.y = groundY - 40 * S; }
      const a = (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(time * s.tw + s.ph))) * appear;
      ctx.fillStyle = `rgba(255,228,160,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * Math.max(1, S * 0.8), 0, TAU); ctx.fill();
    }
  }

  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.9);
    ctx.bezierCurveTo(-s * 1.3, -s * 0.1, -s * 0.6, -s * 1.0, 0, -s * 0.35);
    ctx.bezierCurveTo(s * 0.6, -s * 1.0, s * 1.3, -s * 0.1, 0, s * 0.9);
    ctx.closePath();
  }

  function spawnHeart(x, y, burst) {
    hearts.push({
      x, y, s: (burst ? 4 + Math.random() * 6 : 3 + Math.random() * 8) * Math.max(S, 0.7),
      vx: burst ? (Math.random() - 0.5) * 90 : 0,
      vy: burst ? -40 - Math.random() * 70 : 22 + Math.random() * 28,
      g: burst ? 70 : 0, ph: Math.random() * TAU, life: 0,
    });
  }

  function drawHearts(time, dt) {
    if (time > nextHeart) {
      spawnHeart(W * (0.1 + Math.random() * 0.8), -12, false);
      nextHeart = time + 1.2 + Math.random() * 1.8;
    }
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.life += dt;
      h.vy += h.g * dt;
      h.y += h.vy * dt;
      h.x += (h.vx + Math.sin(time * 1.4 + h.ph) * 10) * dt;
      const a = clamp((groundY - h.y) / 90) * clamp(h.life / 0.4);
      if (a <= 0 && h.y > 0) { hearts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(Math.sin(time + h.ph) * 0.25);
      ctx.globalAlpha = a;
      ctx.shadowColor = 'rgba(255,40,70,0.9)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ff3b4e';
      heartPath(h.s);
      ctx.fill();
      ctx.restore();
    }
  }

  // chạm / click để thả tim
  cv.addEventListener('pointerdown', e => {
    for (let i = 0; i < 7; i++) spawnHeart(e.clientX, e.clientY, true);
  });

  // ---------- vòng lặp ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = (now - t0) / 1000;

    ctx.fillStyle = '#03030a';
    ctx.fillRect(0, 0, W, H);

    // ánh sáng nền
    const glowK = clamp((time - 4) / 4);
    const bg = ctx.createRadialGradient(cx, groundY - 150 * S, 0, cx, groundY - 150 * S, 340 * S);
    bg.addColorStop(0, `rgba(255,50,110,${0.09 * glowK})`);
    bg.addColorStop(1, 'rgba(255,50,110,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // mặt đất
    const gg = ctx.createLinearGradient(0, groundY - 20, 0, H);
    gg.addColorStop(0, 'rgba(5,28,14,0)');
    gg.addColorStop(1, '#04150b');
    ctx.fillStyle = gg;
    ctx.fillRect(0, groundY - 20, W, H - groundY + 20);

    for (const b of grass) if (b.layer === 0) drawBlade(b, time);
    for (const l of baseLeaves) drawBaseLeaf(l, time);
    for (const f of flowers) drawStem(f, time);
    for (const f of flowers) drawHead(f, time);
    drawSparkles(time, dt);
    for (const b of grass) if (b.layer === 1) drawBlade(b, time);
    drawHearts(time, dt);

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
